name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_public_hygiene.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pins
        run: |
          echo "exp2res=$(python -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["exp2res"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: jointsome0-lgtm/exp2res
          ref: ${{ steps.pins.outputs.exp2res }}
          path: .exp2res-pin
      - run: python -m pip install -r tests/requirements.txt ./.exp2res-pin
      - run: python -m pytest tests -q
